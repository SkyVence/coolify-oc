# Publishes to npm and creates a GitHub release when a version tag is pushed.
#
# Auth is npm trusted publishing: the job exchanges its OIDC token for a
# short-lived credential, so there is no NPM_TOKEN secret to create or rotate.
# npm checks that claim against the trusted publisher configured on the package,
# which must name this repository and this workflow file.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token that trusted publishing exchanges for a credential.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Same gate as prepublishOnly, run explicitly so a failure is obvious.
      - run: bun run check

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm 10.
      - run: npm install --global npm@latest

      # No NODE_AUTH_TOKEN here on purpose: setting one would make npm use the
      # token instead of the OIDC exchange.
      - run: npm publish --access public --provenance

      # 0.2.0-0.2.8 were published from raw TypeScript sources, which gives the
      # TUI plugin its own Solid runtime and freezes sidebar updates. Warn
      # anyone pinned to them; the versions themselves are still installable.
      # Non-fatal: trusted publishing may not authorise deprecation.
      - continue-on-error: true
        run: npm deprecate '@skyvence/coolify-oc@>=0.2.0 <0.2.9' "Broken TUI packaging: the sidebar never updates. Upgrade to 0.2.9 or newer."

  # Runs only once the package is on npm, so a GitHub release never advertises
  # a version that failed to publish. `--generate-notes` builds the body from
  # the commits since the previous release.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
